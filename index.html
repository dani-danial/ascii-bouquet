<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b090e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="for pisya ♥" />
  <title>for pisya ♥</title>
  <meta name="description" content="coded with love — a 3D ASCII flower bouquet" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="for pisya ♥" />
  <meta property="og:description" content="coded with love — a 3D ASCII flower bouquet" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <canvas id="bouquet-canvas" aria-label="Interactive 3D ASCII flower bouquet"></canvas>

    <header class="dedication" id="dedication">
      <p class="dedication-kicker" id="dedication-kicker">coded with love</p>
      <h1 class="dedication-title" id="dedication-title">for pisya <span class="heart-icon">♥</span></h1>
      <p class="dedication-msg" id="dedication-msg">drag to spin · tap for sparkles</p>
    </header>

    <nav class="controls" aria-label="Bouquet controls">
      <button type="button" class="pill-btn" id="btn-play" aria-pressed="true" title="Toggle auto-spin">
        <span id="play-icon">❚❚</span>
        <span id="play-label">Spin</span>
      </button>
      <button type="button" class="pill-btn" id="btn-theme" title="Cycle bouquet palette">
        <span>✿</span>
        <span id="theme-label">Rose</span>
      </button>
      <button type="button" class="pill-btn" id="btn-reset" title="Reset camera view">
        <span>↺</span>
        <span>Reset</span>
      </button>
      <button type="button" class="pill-btn" id="btn-save" title="Save picture for Photos widget">
        <span>📷</span>
        <span id="save-label">Save</span>
      </button>
    </nav>
  </main>

  <script src="bouquet.js"></script>
</body>
</html>
